<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>주차 서비스 앱 프로토타입</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#edf4ff',
              100: '#dfeaff',
              500: '#2563eb',
              600: '#1d4ed8',
              700: '#1e40af'
            },
            amber: {
              500: '#f59e0b'
            }
          },
          boxShadow: {
            soft: '0 20px 50px rgba(37,99,235,0.12)',
            app: '0 20px 50px rgba(15, 23, 42, 0.12)'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&display=swap');

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: 'Pretendard', sans-serif;
      background: #edf2ff;
      color: #0f172a;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .phone {
      width: 100%;
      max-width: 400px;
      height: 844px;
      background: #f8fafc;
      border-radius: 40px;
      border: 8px solid #0f172a;
      box-shadow: 0 32px 80px rgba(15, 23, 42, 0.18);
      position: relative;
      overflow: hidden;
    }

    .statusbar {
      height: 52px;
      background: rgba(255,255,255,0.95);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid rgba(15,23,42,0.05);
      position: relative;
      z-index: 10;
    }

    .statusbar .time {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .statusbar .icons {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #1f2937;
    }

    .notch {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 8px;
      width: 110px;
      height: 18px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
    }

    .app-content {
      position: relative;
      height: calc(100% - 52px - 56px - 22px);
      overflow: hidden;
      background: #f3f6fb;
    }

    .screen {
      width: 100%;
      height: 100%;
      animation: enter 260ms ease;
    }

    @keyframes enter {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .nav {
      height: 60px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      background: rgba(255,255,255,0.96);
      border-top: 1px solid rgba(15,23,42,0.06);
      backdrop-filter: blur(12px);
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      transition: color 0.2s ease;
      position: relative;
    }

    .nav-btn.active {
      color: #2563eb;
    }

    .nav-btn i {
      font-size: 18px;
      margin-bottom: 4px;
    }

    .nav-badge {
      position: absolute;
      top: 8px;
      right: 32px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #16a34a;
      box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.14);
    }

    .homebar {
      height: 22px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px solid rgba(15,23,42,0.04);
    }

    .homebar .bar {
      width: 128px;
      height: 4px;
      border-radius: 999px;
      background: rgba(15,23,42,0.18);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      border: none;
      border-radius: 18px;
      background: linear-gradient(135deg, #2d63f4, #214fe1);
      color: white;
      font-weight: 800;
      box-shadow: 0 18px 30px rgba(37, 99, 235, 0.22);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 20px 32px rgba(37, 99, 235, 0.28);
    }

    .soft-card {
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(15,23,42,0.04);
      box-shadow: 0 12px 28px rgba(15,23,42,0.05);
      border-radius: 24px;
    }

    .map-bg {
      background:
        radial-gradient(circle at 20% 20%, rgba(59,130,246,0.12), transparent 35%),
        linear-gradient(180deg, #edf3ff 0%, #e4ebff 100%);
    }

    .map-grid {
      background-image: radial-gradient(#cddafc 1px, transparent 1px);
      background-size: 16px 16px;
      opacity: 0.7;
    }

    .map-pin {
      position: absolute;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(15,23,42,0.05);
      box-shadow: 0 12px 28px rgba(15,23,42,0.08);
      z-index: 2;
    }

    .map-pin.primary {
      background: linear-gradient(135deg, #2d63f4, #214fe1);
      color: white;
    }

    .section-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #7c8798;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="statusbar">
      <span class="time" id="current-time">09:41</span>
      <div class="notch"></div>
      <div class="icons">
        <i class="fa-solid fa-signal"></i>
        <i class="fa-solid fa-wifi"></i>
        <i class="fa-solid fa-battery-full"></i>
      </div>
    </div>

    <div id="app-container" class="app-content hide-scrollbar"></div>

    <div id="bottom-nav" class="nav hidden">
      <button class="nav-btn active" id="nav-home" onclick="switchTab('home')">
        <i class="fa-solid fa-house"></i>
        <span>홈</span>
      </button>
      <button class="nav-btn" id="nav-status" onclick="switchTab('status')">
        <i class="fa-solid fa-car-side"></i>
        <span>이용 현황</span>
        <span id="active-badge" class="nav-badge hidden"></span>
      </button>
      <button class="nav-btn" id="nav-mypage" onclick="switchTab('mypage')">
        <i class="fa-solid fa-user"></i>
        <span>마이페이지</span>
      </button>
    </div>

    <div class="homebar">
      <div class="bar"></div>
    </div>
  </div>

  <script>
    const appState = {
      currentScreen: 'onboarding',
      carNumber: '123가 4567',
      destination: '강남역 스파크플러스',
      selectedParking: {
        name: '강남역 공영주차장',
        distance: '도보 3분 (240m)',
        fee: '최초 30분 2,000원 / 10분당 1,000원',
        status: '여유',
        rating: 4.6
      },
      isParkingActive: false
    };

    function updateClock() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('current-time').innerText = `${hh}:${mm}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function render() {
      const container = document.getElementById('app-container');
      const bottomNav = document.getElementById('bottom-nav');
      const hideNav = ['onboarding', 'vehicle_register', 'payment_loading', 'payment_complete', 'exit_complete'];

      if (hideNav.includes(appState.currentScreen)) {
        bottomNav.classList.add('hidden');
      } else {
        bottomNav.classList.remove('hidden');
        const home = document.getElementById('nav-home');
        const status = document.getElementById('nav-status');
        const mypage = document.getElementById('nav-mypage');
        home.classList.remove('active');
        status.classList.remove('active');
        mypage.classList.remove('active');

        if (['home', 'map_compare', 'detail'].includes(appState.currentScreen)) home.classList.add('active');
        else if (['status', 'payment'].includes(appState.currentScreen)) status.classList.add('active');
        else if (['mypage', 'vehicle_manage'].includes(appState.currentScreen)) mypage.classList.add('active');
      }

      const activeBadge = document.getElementById('active-badge');
      appState.isParkingActive ? activeBadge.classList.remove('hidden') : activeBadge.classList.add('hidden');

      switch(appState.currentScreen) {
        case 'onboarding': container.innerHTML = renderOnboarding(); break;
        case 'vehicle_register': container.innerHTML = renderVehicleRegister(); break;
        case 'home': container.innerHTML = renderHome(); break;
        case 'map_compare': container.innerHTML = renderMapCompare(); break;
        case 'detail': container.innerHTML = renderDetail(); break;
        case 'entry_simulation': container.innerHTML = renderEntrySimulation(); break;
        case 'status': container.innerHTML = renderStatus(); break;
        case 'payment': container.innerHTML = renderPayment(); break;
        case 'payment_loading': container.innerHTML = renderPaymentLoading(); break;
        case 'payment_complete': container.innerHTML = renderPaymentComplete(); break;
        case 'exit_complete': container.innerHTML = renderExitComplete(); break;
        case 'mypage': container.innerHTML = renderMypage(); break;
        case 'vehicle_manage': container.innerHTML = renderVehicleManage(); break;
        default: container.innerHTML = renderHome();
      }

      const first = container.firstElementChild;
      if (first) first.classList.add('screen');
    }

    function navigate(screen) {
      appState.currentScreen = screen;
      render();
    }

    function switchTab(tab) {
      if (tab === 'home') navigate('home');
      if (tab === 'status') navigate('status');
      if (tab === 'mypage') navigate('mypage');
    }

    function renderOnboarding() {
      return `
        <div class="h-full bg-gradient-to-b from-brand-500 to-brand-700 px-6 pt-8 pb-6 text-white">
          <div class="h-full flex flex-col justify-between">
            <div class="pt-10 text-center">
              <div class="mx-auto mb-6 flex h-24 w-24 items-center justify-center rounded-[30px] bg-white/12 border border-white/20 shadow-inner text-4xl backdrop-blur-sm">🚗</div>
              <span class="pill bg-amber-500 text-slate-900">주차 서비스</span>
              <h1 class="mt-5 text-[30px] font-black leading-[1.15] tracking-[-0.06em]">낯선 곳에서도<br>주차를 쉽게</h1>
              <p class="mt-3 text-sm leading-6 text-brand-100">목적지 주변 주차장 비교부터<br>차량번호 인식 입차, 앱 정산까지 한 번에</p>
            </div>

            <div class="space-y-3 pb-2">
              <button onclick="navigate('vehicle_register')" class="btn-primary py-4 text-[15px]">간편 로그인 (카카오/네이버)</button>
              <button onclick="navigate('home')" class="w-full rounded-[18px] border border-white/40 bg-white/10 py-3 text-[14px] font-semibold text-white">나중에 하기</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderVehicleRegister() {
      return `
        <div class="h-full bg-white px-6 py-6">
          <div class="mb-7 flex items-center">
            <button onclick="navigate('onboarding')" class="mr-3 flex h-9 w-9 items-center justify-center rounded-full bg-slate-100 text-slate-700"><i class="fa-solid fa-arrow-left"></i></button>
            <h2 class="text-[20px] font-black tracking-[-0.04em] text-slate-800">차량·결제수단 등록</h2>
          </div>

          <p class="mb-6 text-xs leading-5 text-slate-500">차량번호를 등록하면 입·출차 시 자동 인식 및 앱 정산이 원활하게 연동됩니다.</p>

          <div class="space-y-5">
            <div>
              <label class="mb-2 block text-[11px] font-bold text-slate-700">차량 번호</label>
              <div class="relative">
                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"><i class="fa-solid fa-car"></i></span>
                <input id="input-car-num" value="${appState.carNumber}" class="w-full rounded-2xl border border-slate-200 bg-slate-50 py-3.5 pl-11 pr-4 text-sm font-bold text-slate-800 focus:border-brand-500 focus:outline-none focus:ring-4 focus:ring-brand-100" />
              </div>
            </div>

            <div>
              <label class="mb-2 block text-[11px] font-bold text-slate-700">결제수단 등록</label>
              <div class="flex items-center justify-between rounded-2xl border border-brand-100 bg-brand-50 p-4">
                <div class="flex items-center gap-3">
                  <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-brand-500 text-white"><i class="fa-solid fa-credit-card"></i></div>
                  <div>
                    <p class="text-[11px] font-extrabold text-slate-800">KB국민카드 (간편결제 등록)</p>
                    <p class="mt-0.5 text-[10px] text-slate-500">기본 결제수단으로 등록됨</p>
                  </div>
                </div>
                <i class="fa-solid fa-check text-brand-500"></i>
              </div>
            </div>
          </div>

          <div class="mt-10">
            <button onclick="saveVehicleAndProceed()" class="btn-primary py-4 text-[15px]">등록 완료 및 시작하기</button>
          </div>
        </div>
      `;
    }

    function saveVehicleAndProceed() {
      const val = document.getElementById('input-car-num').value;
      if (val) appState.carNumber = val;
      navigate('home');
    }

    function renderHome() {
      return `
        <div class="h-full bg-slate-50 px-5 py-5">
          <div class="mb-6 flex items-center justify-between">
            <div>
              <span class="pill bg-brand-50 text-brand-600">주차 서비스</span>
              <h1 class="mt-3 text-[26px] font-black tracking-[-0.05em] text-slate-900">어디로 가시나요?</h1>
            </div>
            <div class="flex h-11 w-11 items-center justify-center rounded-full bg-slate-200 text-lg">🚗</div>
          </div>

          <div onclick="navigate('map_compare')" class="soft-card flex cursor-pointer items-center gap-3 p-4 transition-transform hover:-translate-y-0.5">
            <i class="fa-solid fa-magnifying-glass text-brand-500"></i>
            <span class="flex-1 text-[14px] font-semibold text-slate-600">${appState.destination}</span>
            <span class="rounded-xl bg-slate-100 px-2 py-1 text-[10px] font-bold text-slate-500">검색</span>
          </div>

          <div class="mt-6">
            <p class="section-label mb-3">최근 검색 목적지</p>
            <div class="space-y-2">
              <div onclick="navigate('map_compare')" class="soft-card flex cursor-pointer items-center justify-between p-3 hover:bg-slate-50">
                <div class="flex items-center gap-3">
                  <div class="flex h-9 w-9 items-center justify-center rounded-full bg-slate-100 text-slate-600"><i class="fa-solid fa-location-dot text-[11px]"></i></div>
                  <div>
                    <p class="text-[12px] font-extrabold text-slate-800">강남역 스파크플러스</p>
                    <p class="mt-0.5 text-[10px] text-slate-400">서울 강남구 테헤란로</p>
                  </div>
                </div>
                <i class="fa-solid fa-chevron-right text-[11px] text-slate-300"></i>
              </div>

              <div onclick="navigate('map_compare')" class="soft-card flex cursor-pointer items-center justify-between p-3 hover:bg-slate-50">
                <div class="flex items-center gap-3">
                  <div class="flex h-9 w-9 items-center justify-center rounded-full bg-slate-100 text-slate-600"><i class="fa-solid fa-location-dot text-[11px]"></i></div>
                  <div>
                    <p class="text-[12px] font-extrabold text-slate-800">코엑스몰 주차장</p>
                    <p class="mt-0.5 text-[10px] text-slate-400">서울 강남구 영동대로</p>
                  </div>
                </div>
                <i class="fa-solid fa-chevron-right text-[11px] text-slate-300"></i>
              </div>
            </div>
          </div>

          <div class="mt-6 rounded-[30px] bg-gradient-to-r from-brand-500 to-brand-700 p-4 text-white shadow-soft">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-[10px] font-bold text-brand-100">내 등록 차량</p>
                <p class="mt-1 text-[22px] font-black tracking-[-0.04em]">${appState.carNumber}</p>
              </div>
              <button onclick="navigate('vehicle_manage')" class="rounded-xl bg-white/20 px-3 py-2 text-[11px] font-bold">관리</button>
            </div>
          </div>

          <div class="mt-auto pt-6 text-center text-[10px] text-slate-400">입차 시 차량번호로 자동 인식·확인됩니다.</div>
        </div>
      `;
    }

    function renderMapCompare() {
      return `
        <div class="relative h-full overflow-hidden bg-slate-200">
          <div class="map-bg map-grid absolute inset-0"></div>

          <div class="map-pin primary left-[20%] top-[22%]">강남역 공영 (2,000원)</div>
          <div class="map-pin right-[18%] top-[48%]">역삼주차장 (3,000원)</div>
          <div class="map-pin left-[18%] bottom-[28%]">테헤란로 민영 (2,500원)</div>

          <div class="relative z-10 flex items-center gap-3 p-4 pt-4">
            <button onclick="navigate('home')" class="flex h-10 w-10 items-center justify-center rounded-2xl bg-white text-slate-700 shadow-md"><i class="fa-solid fa-arrow-left"></i></button>
            <div class="flex flex-1 items-center gap-2 rounded-2xl border border-slate-100 bg-white px-4 py-3 shadow-md">
              <i class="fa-solid fa-magnifying-glass text-[11px] text-brand-500"></i>
              <span class="text-sm font-semibold text-slate-700">${appState.destination}</span>
            </div>
          </div>

          <div class="absolute inset-x-0 bottom-0 z-10 max-h-[360px] overflow-y-auto rounded-t-[28px] bg-white/95 p-4 pb-6 shadow-[0_-20px_50px_rgba(15,23,42,0.08)] hide-scrollbar">
            <div class="mx-auto mb-3 h-1 w-12 rounded-full bg-slate-300"></div>
            <div class="mb-3 flex items-center justify-between">
              <p class="section-label">주변 주차장 비교</p>
              <span class="text-[10px] font-bold text-brand-600">3개 발견</span>
            </div>

            <div onclick="navigate('detail')" class="mb-3 cursor-pointer rounded-[24px] border-2 border-brand-200 bg-brand-50 p-4 shadow-md">
              <div class="flex items-start justify-between">
                <div>
                  <div class="flex items-center gap-2">
                    <h3 class="text-[14px] font-black text-slate-900">${appState.selectedParking.name}</h3>
                    <span class="rounded-full bg-emerald-100 px-2 py-0.5 text-[9px] font-bold text-emerald-700">여유</span>
                  </div>
                  <p class="mt-1 text-[11px] text-slate-500">${appState.selectedParking.distance} · ★ ${appState.selectedParking.rating}</p>
                </div>
                <span class="rounded-xl bg-white px-2 py-1 text-[10px] font-black text-brand-600">추천</span>
              </div>
              <div class="mt-3 flex items-center justify-between border-t border-brand-100 pt-3 text-[11px]">
                <span class="font-medium text-slate-600">기본요금: 최초 30분 2,000원</span>
                <span class="font-extrabold text-brand-600">상세보기</span>
              </div>
            </div>

            <div class="rounded-[22px] border border-slate-200 bg-white p-4">
              <div class="flex items-start justify-between">
                <div>
                  <div class="flex items-center gap-2">
                    <h3 class="text-[14px] font-black text-slate-900">역삼동 민영주차장</h3>
                    <span class="rounded-full bg-amber-100 px-2 py-0.5 text-[9px] font-bold text-amber-700">보통</span>
                  </div>
                  <p class="mt-1 text-[11px] text-slate-500">도보 5분 (380m) · ★ 4.2</p>
                </div>
              </div>
              <div class="mt-3 flex items-center justify-between border-t border-slate-100 pt-3 text-[11px]">
                <span class="font-medium text-slate-600">기본요금: 최초 30분 3,000원</span>
                <span class="text-slate-400">비교</span>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderDetail() {
      return `
        <div class="h-full bg-white">
          <div class="flex items-center border-b border-slate-100 px-4 pb-3 pt-4">
            <button onclick="navigate('map_compare')" class="mr-3 flex h-9 w-9 items-center justify-center rounded-full bg-slate-100 text-slate-700"><i class="fa-solid fa-arrow-left"></i></button>
            <h2 class="text-[18px] font-black tracking-[-0.04em] text-slate-800">주차장 상세 정보</h2>
          </div>

          <div class="px-5 pt-5">
            <div class="mb-4 flex items-start justify-between">
              <div>
                <span class="rounded-full bg-emerald-100 px-2.5 py-1 text-[10px] font-bold text-emerald-700">여유 상태: 여유</span>
                <h1 class="mt-3 text-[24px] font-black tracking-[-0.04em] text-slate-900">${appState.selectedParking.name}</h1>
                <p class="mt-1 text-[11px] text-slate-500">서울 강남구 역삼동 820-1 · ${appState.selectedParking.distance}</p>
              </div>
              <div class="text-right text-[14px] font-black text-amber-500"><i class="fa-solid fa-star"></i> ${appState.selectedParking.rating}</div>
            </div>

            <div class="mb-4 rounded-[24px] border border-slate-200 bg-slate-50 p-4">
              <h3 class="mb-2 text-[11px] font-extrabold uppercase tracking-[0.08em] text-slate-700">요금 안내</h3>
              <p class="text-[12px] text-slate-600">${appState.selectedParking.fee}</p>
              <p class="mt-2 text-[10px] font-bold text-brand-600"><i class="fa-solid fa-circle-info"></i> 앱 정산 시 정산기 앞 대기 없이 바로 출차 가능</p>
            </div>

            <div class="mb-4 rounded-[24px] border border-brand-100 bg-brand-50 p-4">
              <h3 class="mb-2 text-[11px] font-extrabold uppercase tracking-[0.08em] text-brand-800">외부 지도 앱 연동</h3>
              <p class="mb-3 text-[10px] text-brand-700">선택하신 주차장 위치로 바로 길안내를 연결합니다.</p>
              <div class="grid grid-cols-2 gap-2">
                <button onclick="openExternalMap('네이버지도')" class="rounded-2xl bg-emerald-600 py-2.5 text-[11px] font-extrabold text-white"><i class="fa-solid fa-map-location-dot mr-1"></i>네이버 지도</button>
                <button onclick="openExternalMap('티맵')" class="rounded-2xl bg-slate-900 py-2.5 text-[11px] font-extrabold text-white"><i class="fa-solid fa-location-arrow mr-1"></i>티맵</button>
              </div>
            </div>
          </div>

          <div class="px-5 pb-5">
            <button onclick="navigate('entry_simulation')" class="btn-primary py-4 text-[14px]">주차장 도착 (차량번호 입차 확인)</button>
          </div>
        </div>
      `;
    }

    function openExternalMap(map) {
      alert(`${map} 앱으로 연동하여 길안내를 시작합니다! (프로토타입)`);
    }

    function renderEntrySimulation() {
      return `
        <div class="h-full bg-white px-6 py-7">
          <div class="flex h-full flex-col justify-between text-center">
            <div>
              <div class="mx-auto mb-4 flex h-28 w-28 items-center justify-center rounded-[32px] bg-brand-50 text-4xl text-brand-600 shadow-sm">🚗</div>
              <span class="pill bg-brand-50 text-brand-600">자동 출입차 인식</span>
              <h2 class="mt-4 text-[26px] font-black tracking-[-0.05em] text-slate-900">입차 확인 중...</h2>
              <p class="mt-2 text-[11px] leading-5 text-slate-500">주차장 입구의 카메라가 번호판을 인식하여<br>입차 처리를 진행합니다.</p>

              <div class="mt-7 rounded-[24px] border-2 border-dashed border-brand-200 bg-slate-50 p-5">
                <p class="text-[11px] font-bold text-slate-400">인식된 차량 번호</p>
                <p class="mt-2 text-[26px] font-black tracking-[0.18em] text-slate-800">${appState.carNumber}</p>
                <p class="mt-3 text-[11px] font-extrabold text-emerald-600"><i class="fa-solid fa-circle-check"></i> 등록된 차량 및 결제수단 확인 완료</p>
              </div>
            </div>

            <button onclick="completeEntry()" class="btn-primary py-4 text-[14px]">입차 완료 및 이용 시작하기</button>
          </div>
        </div>
      `;
    }

    function completeEntry() {
      appState.isParkingActive = true;
      navigate('status');
    }

    function renderStatus() {
      if (!appState.isParkingActive) {
        return `
          <div class="h-full bg-slate-50 px-6 py-7">
            <div class="flex h-full flex-col items-center justify-between text-center">
              <div class="pt-12">
                <div class="mx-auto mb-5 flex h-20 w-20 items-center justify-center rounded-full bg-slate-200 text-3xl text-slate-400"><i class="fa-solid fa-car-side"></i></div>
                <h2 class="text-[18px] font-black tracking-[-0.04em] text-slate-900">이용 중인 주차장이 없어요</h2>
                <p class="mt-2 text-[11px] text-slate-500">목적지 검색 후 주차장을 이용해 보세요.</p>
              </div>
              <button onclick="navigate('home')" class="btn-primary py-4 text-[14px]">주차장 검색하기</button>
            </div>
          </div>
        `;
      }

      return `
        <div class="h-full bg-slate-50 px-5 py-5">
          <div class="mb-5 flex items-center justify-between">
            <h2 class="text-[22px] font-black tracking-[-0.05em] text-slate-900">실시간 이용 현황</h2>
            <span class="rounded-full bg-emerald-100 px-2.5 py-1 text-[10px] font-bold text-emerald-700">
              <span class="mr-1.5 inline-block h-2 w-2 rounded-full bg-emerald-500 animate-ping"></span>주차 이용 중
            </span>
          </div>

          <div class="mb-5 rounded-[24px] border border-slate-100 bg-white p-4 shadow-sm">
            <div class="flex items-center gap-3 border-b border-slate-100 pb-3">
              <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-brand-100 font-black text-brand-600">P</div>
              <div>
                <h3 class="text-[14px] font-extrabold text-slate-800">${appState.selectedParking.name}</h3>
                <p class="text-[10px] text-slate-400">차량번호: ${appState.carNumber}</p>
              </div>
            </div>

            <div class="mt-4 grid grid-cols-2 gap-3">
              <div class="rounded-[18px] bg-slate-50 p-3">
                <p class="text-[10px] font-bold text-slate-400">입차 시간</p>
                <p class="mt-1 text-[13px] font-extrabold text-slate-800">방금 전</p>
              </div>
              <div class="rounded-[18px] bg-slate-50 p-3">
                <p class="text-[10px] font-bold text-slate-400">이용 시간</p>
                <p class="mt-1 text-[13px] font-extrabold text-brand-600">0시간 12분</p>
              </div>
            </div>

            <div class="mt-4 rounded-[22px] bg-brand-50 p-4">
              <p class="text-[10px] font-bold text-brand-600">현재 누적 요금</p>
              <p class="mt-1 text-[24px] font-black text-brand-700">2,000원</p>
            </div>
          </div>

          <div class="rounded-[22px] border border-amber-200 bg-amber-50 p-4 text-[11px] leading-5 text-amber-800">
            <p class="mb-1 font-extrabold"><i class="fa-solid fa-lightbulb mr-1"></i>출차 안내</p>
            <p>볼일을 마치고 출차 직전에 아래 '정산하기' 버튼을 눌러 앱에서 간편하게 정산을 완료하세요.</p>
          </div>

          <div class="mt-6">
            <button onclick="navigate('payment')" class="btn-primary py-4 text-[14px]">출차 직전 정산하기</button>
          </div>
        </div>
      `;
    }

    function renderPayment() {
      return `
        <div class="h-full bg-white px-5 py-5">
          <div class="mb-6 flex items-center">
            <button onclick="navigate('status')" class="mr-3 flex h-9 w-9 items-center justify-center rounded-full bg-slate-100 text-slate-700"><i class="fa-solid fa-arrow-left"></i></button>
            <h2 class="text-[20px] font-black tracking-[-0.04em] text-slate-800">출차 직전 정산</h2>
          </div>

          <div class="mb-6 rounded-[24px] border border-slate-100 bg-slate-50 p-4">
            <div class="flex items-center justify-between py-1 text-[11px] text-slate-500">
              <span>주차장</span>
              <span class="font-extrabold text-slate-800">${appState.selectedParking.name}</span>
            </div>
            <div class="flex items-center justify-between py-1 text-[11px] text-slate-500">
              <span>이용 시간</span>
              <span class="font-extrabold text-slate-800">1시간 15분</span>
            </div>
            <div class="mt-3 flex items-center justify-between border-t border-slate-200 pt-3">
              <span class="text-[13px] font-extrabold text-slate-900">총 결제금액</span>
              <span class="text-[22px] font-black text-brand-600">3,000원</span>
            </div>
          </div>

          <p class="section-label mb-3">결제수단 선택</p>
          <div class="space-y-3">
            <div class="flex items-center justify-between rounded-[22px] border-2 border-brand-200 bg-brand-50 p-4">
              <div class="flex items-center gap-3">
                <div class="flex h-8 w-8 items-center justify-center rounded-xl bg-brand-500 text-[11px] text-white"><i class="fa-solid fa-credit-card"></i></div>
                <div>
                  <p class="text-[12px] font-extrabold text-slate-800">신용카드 (기본등록)</p>
                  <p class="text-[10px] text-slate-500">KB국민 0000-****</p>
                </div>
              </div>
              <i class="fa-solid fa-circle-check text-brand-500"></i>
            </div>

            <div class="flex items-center justify-between rounded-[22px] border border-slate-200 bg-white p-4 opacity-60">
              <div class="flex items-center gap-3">
                <div class="flex h-8 w-8 items-center justify-center rounded-xl bg-slate-200 text-[11px] text-slate-600"><i class="fa-solid fa-wallet"></i></div>
                <div>
                  <p class="text-[12px] font-extrabold text-slate-800">간편결제</p>
                </div>
              </div>
            </div>
          </div>

          <div class="mt-8">
            <button onclick="startPaymentProcess()" class="btn-primary py-4 text-[14px]">3,000원 결제하기</button>
          </div>
        </div>
      `;
    }

    function startPaymentProcess() {
      navigate('payment_loading');
      setTimeout(() => navigate('payment_complete'), 2000);
    }

    function renderPaymentLoading() {
      return `
        <div class="flex h-full flex-col items-center justify-center bg-white px-6 text-center">
          <div class="mb-6 flex h-28 w-28 items-center justify-center rounded-[32px] bg-brand-50 text-4xl text-brand-600 shadow-sm">⏳</div>
          <h2 class="text-[22px] font-black tracking-[-0.05em] text-slate-900">결제 진행 중입니다</h2>
          <p class="mt-2 text-[11px] leading-5 text-slate-500">잠시만 기다려주세요. 안전하게 결제 처리 중입니다.</p>
        </div>
      `;
    }

    function renderPaymentComplete() {
      return `
        <div class="flex h-full flex-col justify-between bg-white px-6 py-7 text-center">
          <div class="pt-6">
            <div class="mb-6 flex h-28 w-28 items-center justify-center rounded-[32px] bg-emerald-50 text-4xl text-emerald-600 shadow-sm">✓</div>
            <span class="pill bg-emerald-100 text-emerald-700">결제 완료</span>
            <h2 class="mt-4 text-[28px] font-black tracking-[-0.05em] text-slate-900">결제가 완료되었습니다!</h2>

            <div class="mt-8 rounded-[28px] border border-brand-200 bg-brand-50 p-6">
              <p class="text-[11px] font-bold text-brand-700">출차 유예 시간</p>
              <p class="mt-1 text-[34px] font-black text-brand-600">15분 남음</p>
              <p class="mt-3 text-[11px] leading-5 text-slate-500">정산기 앞 대기 없이, 유예 시간 내에 차량번호 인식으로 바로 출차하세요!</p>
            </div>
          </div>

          <button onclick="simulateExit()" class="btn-primary py-4 text-[14px]">출차하러 가기</button>
        </div>
      `;
    }

    function simulateExit() {
      appState.isParkingActive = false;
      navigate('exit_complete');
    }

    function renderExitComplete() {
      return `
        <div class="flex h-full flex-col justify-between bg-white px-6 py-7 text-center">
          <div class="pt-10">
            <div class="mb-6 flex h-28 w-28 items-center justify-center rounded-[32px] bg-brand-50 text-4xl text-brand-600 shadow-sm">🚘</div>
            <span class="pill bg-brand-50 text-brand-600">출차 완료</span>
            <h2 class="mt-4 text-[28px] font-black tracking-[-0.05em] text-slate-900">안전하게 출차되었습니다</h2>
            <p class="mt-2 text-[11px] leading-5 text-slate-500">이용해 주셔서 감사합니다. 다음에 또 편리하게 이용하세요!</p>
          </div>

          <button onclick="navigate('home')" class="btn-primary py-4 text-[14px]">홈으로 돌아가기</button>
        </div>
      `;
    }

    function renderMypage() {
      return `
        <div class="h-full bg-slate-50 px-5 py-5">
          <h2 class="mb-5 text-[22px] font-black tracking-[-0.05em] text-slate-900">마이페이지</h2>

          <div class="soft-card mb-5 flex items-center gap-4 p-4">
            <div class="flex h-12 w-12 items-center justify-center rounded-full bg-brand-500 text-lg text-white shadow-soft">🚗</div>
            <div>
              <h3 class="text-[14px] font-extrabold text-slate-800">방문객 운전자님</h3>
              <p class="text-[10px] text-slate-400">간편 로그인 회원 (목업)</p>
            </div>
          </div>

          <div class="soft-card overflow-hidden">
            <div onclick="navigate('vehicle_manage')" class="flex cursor-pointer items-center justify-between border-b border-slate-100 p-4 hover:bg-slate-50">
              <div class="flex items-center gap-3">
                <i class="fa-solid fa-car text-brand-500"></i>
                <span class="text-[12px] font-extrabold text-slate-800">차량 관리</span>
              </div>
              <span class="text-[11px] text-slate-400">${appState.carNumber} &gt;</span>
            </div>

            <div class="flex items-center justify-between border-b border-slate-100 p-4 hover:bg-slate-50">
              <div class="flex items-center gap-3">
                <i class="fa-solid fa-credit-card text-brand-500"></i>
                <span class="text-[12px] font-extrabold text-slate-800">결제수단 관리</span>
              </div>
              <span class="text-[11px] text-slate-400">KB국민카드 &gt;</span>
            </div>

            <div class="flex items-center justify-between p-4 hover:bg-slate-50">
              <div class="flex items-center gap-3">
                <i class="fa-solid fa-receipt text-brand-500"></i>
                <span class="text-[12px] font-extrabold text-slate-800">이용 내역</span>
              </div>
              <span class="text-[11px] text-slate-400">&gt;</span>
            </div>
          </div>

          <div class="mt-8 text-center">
            <button onclick="navigate('onboarding')" class="text-[11px] text-slate-400 underline">로그아웃 / 온보딩으로 이동</button>
          </div>
        </div>
      `;
    }

    function renderVehicleManage() {
      return `
        <div class="h-full bg-white px-5 py-5">
          <div class="mb-6 flex items-center">
            <button onclick="navigate('mypage')" class="mr-3 flex h-9 w-9 items-center justify-center rounded-full bg-slate-100 text-slate-700"><i class="fa-solid fa-arrow-left"></i></button>
            <h2 class="text-[20px] font-black tracking-[-0.04em] text-slate-800">차량 관리</h2>
          </div>

          <div class="mb-5 rounded-[24px] border border-brand-200 bg-brand-50 p-4">
            <p class="text-[11px] font-extrabold text-brand-800">등록된 차량 번호</p>
            <p class="mt-1 text-[28px] font-black text-brand-600">${appState.carNumber}</p>
          </div>

          <label class="mb-2 block text-[11px] font-extrabold text-slate-700">차량 번호 변경</label>
          <input id="edit-car-num" value="${appState.carNumber}" class="mb-8 w-full rounded-2xl border border-slate-200 bg-slate-50 p-3.5 text-[14px] font-bold text-slate-800 focus:border-brand-500 focus:outline-none focus:ring-4 focus:ring-brand-100" />

          <button onclick="updateCarNum()" class="btn-primary py-4 text-[14px]">저장하기</button>
        </div>
      `;
    }

    function updateCarNum() {
      const val = document.getElementById('edit-car-num').value;
      if (val) appState.carNumber = val;
      navigate('mypage');
    }

    render();
  </script>
</body>
</html>
