<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주차 서비스 앱 프로토타입 (차량번호 출입차)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef4ff',
                            100: '#dfeaff',
                            200: '#c8d9ff',
                            500: '#2563eb',
                            600: '#1d4ed8',
                            700: '#1e40af',
                        },
                        slate: {
                            950: '#0f172a'
                        },
                        amber: {
                            500: '#f59e0b'
                        }
                    },
                    boxShadow: {
                        soft: '0 20px 45px rgba(37, 99, 235, 0.14)',
                        card: '0 15px 35px rgba(15, 23, 42, 0.08)',
                        panel: '0 10px 30px rgba(15, 23, 42, 0.06)'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&display=swap');

        :root {
            --bg-soft: #dde3f2;
            --panel: #f8f9fc;
            --card: #ffffff;
            --ink: #101828;
            --muted: #667085;
            --line: rgba(15, 23, 42, 0.08);
            --brand: #2b5de8;
            --brand-strong: #1d4ed8;
            --brand-soft: #edf3ff;
            --green-soft: #dff9ee;
            --green: #0ea86a;
            --amber-soft: #fff4d8;
            --amber: #f59e0b;
            --shadow: 0 22px 50px rgba(15, 23, 42, 0.10);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: 'Pretendard', sans-serif;
            background: var(--bg-soft);
            color: var(--ink);
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            overflow-x: hidden;
        }

        .app-shell {
            width: 100%;
            max-width: 420px;
            height: 844px;
            background: #f7f7fb;
            border-radius: 40px;
            border: 8px solid #0f172a;
            box-shadow: 0 30px 80px rgba(15, 23, 42, 0.18);
            position: relative;
            overflow: hidden;
            transform: translateY(0);
        }

        .statusbar {
            height: 52px;
            background: rgba(255,255,255,0.9);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px 0 18px;
            border-bottom: 1px solid rgba(15, 23, 42, 0.05);
            position: relative;
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        .statusbar .time {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #111827;
        }

        .statusbar .indicators {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #1f2937;
            font-size: 12px;
        }

        .status-notch {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 8px;
            width: 112px;
            height: 18px;
            background: rgba(15, 23, 42, 0.92);
            border-radius: 999px;
            z-index: 12;
        }

        #app-container {
            position: relative;
            height: calc(100% - 52px - 56px - 22px);
            overflow: hidden;
            background: #f3f5fa;
        }

        .screen {
            width: 100%;
            height: 100%;
            animation: screenEnter 360ms cubic-bezier(.2,.8,.2,1);
            transform-origin: center center;
        }

        @keyframes screenEnter {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.985);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .nav {
            height: 60px;
            border-top: 1px solid rgba(15, 23, 42, 0.06);
            background: rgba(255,255,255,0.94);
            display: grid;
            grid-template-columns: repeat(3, minmax(0,1fr));
            backdrop-filter: blur(10px);
            z-index: 12;
            position: relative;
        }

        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 11px;
            color: #98a2b3;
            transition: all 200ms ease;
            position: relative;
        }

        .nav-btn.active {
            color: var(--brand);
        }

        .nav-btn i {
            font-size: 18px;
            margin-bottom: 4px;
        }

        .nav-badge {
            position: absolute;
            top: 7px;
            right: 32px;
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: #17c964;
            box-shadow: 0 0 0 5px rgba(23, 201, 100, 0.12);
        }

        .homebar {
            height: 22px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            border-top: 1px solid rgba(15, 23, 42, 0.04);
        }

        .homebar .bar {
            width: 128px;
            height: 4px;
            background: rgba(15, 23, 42, 0.18);
            border-radius: 999px;
        }

        .soft-card {
            background: rgba(255,255,255,0.9);
            border: 1px solid rgba(15,23,42,0.05);
            box-shadow: 0 14px 30px rgba(15,23,42,0.05);
            backdrop-filter: blur(8px);
        }

        .pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 10px;
            border-radius: 999px;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2d63f4 0%, #214fe1 100%);
            color: white;
            border: none;
            border-radius: 18px;
            box-shadow: 0 18px 30px rgba(37,99,235,0.25);
            transition: transform 200ms ease, box-shadow 200ms ease;
            font-weight: 800;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 22px 36px rgba(37,99,235,0.32);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.9);
            color: var(--brand);
            border: 1px solid rgba(37,99,235,0.12);
            border-radius: 18px;
            box-shadow: 0 12px 24px rgba(15, 23, 42, 0.06);
        }

        .ghost-surface {
            background: linear-gradient(180deg, rgba(255,255,255,0.78), rgba(244,246,251,0.9));
            border: 1px solid rgba(15,23,42,0.05);
        }

        .tiny-label {
            font-size: 10px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 800;
        }

        .section-head {
            font-size: 11px;
            font-weight: 800;
            color: #7c8798;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .screen-title {
            font-weight: 900;
            letter-spacing: -0.05em;
            color: #101828;
        }

        .screen-subtitle {
            font-weight: 600;
            color: #475467;
        }

        .rounded-30 { border-radius: 30px; }
        .rounded-26 { border-radius: 26px; }
        .rounded-22 { border-radius: 22px; }

        .product-card {
            position: relative;
            overflow: hidden;
            border-radius: 30px;
            min-height: 190px;
            background: linear-gradient(180deg, #1e52d7 0%, #1c49db 100%);
            box-shadow: 0 22px 30px rgba(30, 77, 216, 0.20);
        }

        .product-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.20), transparent 28%);
            pointer-events: none;
        }

        .product-figure {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: scale(1.08);
        }

        .product-figure .shape {
            position: relative;
            display: block;
            width: 110px;
            height: 110px;
        }

        .teapot {
            width: 110px;
            height: 112px;
            border-radius: 50% 50% 40% 40% / 34% 34% 56% 56%;
            background: linear-gradient(160deg, #f74d3a 0%, #d93d2e 100%);
            border: 8px solid rgba(255,255,255,0.08);
            box-shadow: inset -8px -8px 18px rgba(0,0,0,0.08), inset 8px 8px 18px rgba(255,255,255,0.10);
            position: relative;
        }

        .teapot::before {
            content: '';
            position: absolute;
            width: 34px;
            height: 28px;
            background: linear-gradient(160deg, #f74d3a, #d93d2e);
            border-radius: 0 0 18px 18px;
            left: 50%;
            top: -18px;
            transform: translateX(-50%);
            box-shadow: inset -8px -8px 10px rgba(0,0,0,0.07);
        }

        .teapot::after {
            content: '';
            position: absolute;
            width: 28px;
            height: 18px;
            border-radius: 40% 40% 50% 50%;
            left: 50%;
            transform: translateX(-50%);
            bottom: -10px;
            background: rgba(255,255,255,0.12);
            border: 5px solid rgba(255,255,255,0.06);
        }

        .canister {
            width: 104px;
            height: 104px;
            border-radius: 32px;
            background: linear-gradient(180deg, #f4d35b 0%, #e5b830 100%);
            box-shadow: inset -8px -8px 12px rgba(0,0,0,0.08), inset 8px 8px 14px rgba(255,255,255,0.15);
            position: relative;
        }

        .canister::before {
            content: '';
            position: absolute;
            inset: 18px;
            border-radius: 16px;
            background: rgba(255,255,255,0.12);
        }

        .mug {
            width: 120px;
            height: 120px;
            position: relative;
            border-radius: 28px 28px 38px 38px;
            background: linear-gradient(180deg, #ff4d3f 0%, #ef3d2b 100%);
            box-shadow: inset -12px -10px 14px rgba(0,0,0,0.09), inset 10px 10px 12px rgba(255,255,255,0.12);
        }

        .mug::before {
            content: '';
            position: absolute;
            width: 18px;
            height: 48px;
            border-radius: 0 20px 20px 0;
            right: -18px;
            top: 26px;
            border: 10px solid #ff4d3f;
            border-left: none;
            box-sizing: border-box;
        }

        .mug::after {
            content: '';
            position: absolute;
            width: 80px;
            height: 20px;
            background: rgba(255,255,255,0.12);
            border-radius: 999px;
            left: 20px;
            bottom: 14px;
        }

        .cylinder {
            width: 120px;
            height: 110px;
            border-radius: 20px 20px 26px 26px;
            background: linear-gradient(180deg, #0f5df6 0%, #1a65e9 100%);
            box-shadow: inset -10px -8px 16px rgba(0,0,0,0.08), inset 8px 8px 14px rgba(255,255,255,0.12);
            position: relative;
        }

        .mini-illustration {
            width: 86px;
            height: 86px;
            border-radius: 22px;
            background: linear-gradient(180deg, #0d63f7, #0d4fdb);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 12px 18px rgba(255,255,255,0.10);
        }

        .mini-illustration .tiny-mug {
            width: 44px;
            height: 44px;
            border-radius: 16px 16px 18px 18px;
            background: linear-gradient(180deg, #ff5b48 0%, #ea3d2f 100%);
            position: relative;
        }

        .mini-illustration .tiny-mug::before {
            content: '';
            position: absolute;
            right: -8px;
            top: 10px;
            width: 10px;
            height: 18px;
            border: 4px solid #ff5b48;
            border-left: none;
            border-radius: 0 8px 8px 0;
        }

        .card-info {
            position: absolute;
            left: 16px;
            right: 16px;
            bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            font-weight: 800;
            z-index: 2;
        }

        .card-info small {
            opacity: 1;
            font-size: 12px;
            font-weight: 700;
        }

        .like-badge {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.95);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(4px);
        }

        .map-bg {
            background: linear-gradient(180deg, #dfe8ff 0%, #eaf0ff 100%);
        }

        .map-point {
            position: absolute;
            border-radius: 999px;
            padding: 8px 12px;
            font-size: 11px;
            font-weight: 700;
            color: #0f172a;
            background: rgba(255,255,255,0.9);
            box-shadow: 0 12px 30px rgba(15,23,42,0.08);
        }

        .map-point.primary {
            background: linear-gradient(135deg, #2364f4 0%, #1d4ed8 100%);
            color: white;
        }

        .map-grid {
            background-image: radial-gradient(#c8d8ff 1px, transparent 1px);
            background-size: 16px 16px;
            opacity: 0.65;
        }

        .feature-card {
            background: rgba(255,255,255,0.92);
            border: 1px solid rgba(15,23,42,0.04);
            border-radius: 26px;
            box-shadow: 0 12px 24px rgba(15,23,42,0.05);
        }

        .progress-dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: rgba(37,99,235,0.6);
            display: inline-block;
        }

        .status-pill {
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(37,99,235,0.08);
            color: var(--brand);
            font-size: 11px;
            font-weight: 800;
        }

        .list-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-radius: 18px;
            background: rgba(255,255,255,0.8);
            border: 1px solid rgba(15,23,42,0.04);
        }

        .option-chip {
            border: 1px solid rgba(37,99,235,0.08);
            background: rgba(37,99,235,0.05);
            border-radius: 999px;
            padding: 10px 16px;
            color: var(--brand);
            font-weight: 700;
        }

        .primary-panel {
            background: linear-gradient(180deg, rgba(255,255,255,0.88), rgba(245,247,252,0.92));
            border: 1px solid rgba(15,23,42,0.05);
            box-shadow: 0 25px 45px rgba(15,23,42,0.06);
        }

        .action-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: space-between;
            padding: 14px 16px;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(234,240,255,0.9));
            border: 1px solid rgba(15,23,42,0.04);
        }

        .tiny-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffb199, #f68a81);
            border: 2px solid rgba(255,255,255,0.8);
        }

        .tiny-avatar.two { background: linear-gradient(135deg, #6ee7b7, #34d399); }
        .tiny-avatar.three { background: linear-gradient(135deg, #93c5fd, #60a5fa); }

        .camera-scan {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 18px auto;
            border-radius: 50%;
            background: linear-gradient(180deg, rgba(37,99,235,0.08), rgba(37,99,235,0.14));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 28px 50px rgba(255,255,255,0.45);
        }

        .camera-scan::before {
            content: '';
            position: absolute;
            inset: 18px;
            border: 1px solid rgba(37,99,235,0.1);
            border-radius: 50%;
        }

        .camera-scan .icon {
            width: 84px;
            height: 84px;
            border-radius: 26px;
            background: linear-gradient(180deg, #dfeaff 0%, #bfd3ff 100%);
            color: var(--brand);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: inset 0 14px 24px rgba(255,255,255,0.8);
        }

        @media (max-width: 440px) {
            body { padding: 0; }
            .app-shell {
                width: 100%;
                height: 100vh;
                max-width: none;
                border-radius: 0;
                border-width: 0;
            }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <div class="statusbar">
            <span class="time" id="current-time">09:41</span>
            <div class="status-notch"></div>
            <div class="indicators">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full"></i>
            </div>
        </div>

        <div id="app-container" class="hide-scrollbar"></div>

        <div id="bottom-nav" class="nav hidden">
            <button class="nav-btn active" id="nav-home" onclick="switchTab('home')">
                <i class="fa-solid fa-house"></i>
                <span>홈</span>
            </button>
            <button class="nav-btn" id="nav-status" onclick="switchTab('status')">
                <i class="fa-solid fa-car-side"></i>
                <span>이용 현황</span>
                <span id="active-badge" class="nav-badge hidden"></span>
            </button>
            <button class="nav-btn" id="nav-mypage" onclick="switchTab('mypage')">
                <i class="fa-solid fa-user"></i>
                <span>마이페이지</span>
            </button>
        </div>

        <div class="homebar">
            <div class="bar"></div>
        </div>
    </div>

    <script>
        const appState = {
            currentScreen: 'onboarding',
            carNumber: '123가 4567',
            paymentMethod: '신용카드 (KB국민 0000)',
            destination: '강남역 스파크플러스',
            selectedParking: {
                name: '강남역 공영주차장',
                distance: '도보 3분 (240m)',
                fee: '최초 30분 2,000원 / 10분당 1,000원',
                status: '여유',
                statusColor: 'bg-emerald-100 text-emerald-700',
                rating: 4.6
            },
            isParkingActive: false,
            entryTime: null,
            timerInterval: null
        };

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2,'0');
            const minutes = String(now.getMinutes()).padStart(2,'0');
            document.getElementById('current-time').innerText = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function render() {
            const container = document.getElementById('app-container');
            const bottomNav = document.getElementById('bottom-nav');
            const hideNavScreens = ['onboarding', 'vehicle_register', 'payment_loading', 'payment_complete', 'exit_complete'];

            if (hideNavScreens.includes(appState.currentScreen)) {
                bottomNav.classList.add('hidden');
            } else {
                bottomNav.classList.remove('hidden');
                const home = document.getElementById('nav-home');
                const status = document.getElementById('nav-status');
                const mypage = document.getElementById('nav-mypage');
                home.classList.remove('active');
                status.classList.remove('active');
                mypage.classList.remove('active');

                if (['home', 'map_compare', 'detail'].includes(appState.currentScreen)) {
                    home.classList.add('active');
                } else if (['status', 'payment'].includes(appState.currentScreen)) {
                    status.classList.add('active');
                } else if (['mypage', 'vehicle_manage'].includes(appState.currentScreen)) {
                    mypage.classList.add('active');
                }
            }

            const activeBadge = document.getElementById('active-badge');
            if (appState.isParkingActive) {
                activeBadge.classList.remove('hidden');
            } else {
                activeBadge.classList.add('hidden');
            }

            switch(appState.currentScreen) {
                case 'onboarding':
                    container.innerHTML = renderOnboarding();
                    break;
                case 'vehicle_register':
                    container.innerHTML = renderVehicleRegister();
                    break;
                case 'home':
                    container.innerHTML = renderHome();
                    break;
                case 'map_compare':
                    container.innerHTML = renderMapCompare();
                    break;
                case 'detail':
                    container.innerHTML = renderDetail();
                    break;
                case 'entry_simulation':
                    container.innerHTML = renderEntrySimulation();
                    break;
                case 'status':
                    container.innerHTML = renderStatus();
                    break;
                case 'payment':
                    container.innerHTML = renderPayment();
                    break;
                case 'payment_loading':
                    container.innerHTML = renderPaymentLoading();
                    break;
                case 'payment_complete':
                    container.innerHTML = renderPaymentComplete();
                    break;
                case 'exit_complete':
                    container.innerHTML = renderExitComplete();
                    break;
                case 'mypage':
                    container.innerHTML = renderMypage();
                    break;
                case 'vehicle_manage':
                    container.innerHTML = renderVehicleManage();
                    break;
                default:
                    container.innerHTML = renderHome();
            }

            const firstChild = container.firstElementChild;
            if (firstChild) {
                firstChild.classList.add('screen');
            }
        }

        function navigate(screenName) {
            appState.currentScreen = screenName;
            render();
        }

        function switchTab(tab) {
            if (tab === 'home') navigate('home');
            if (tab === 'status') navigate('status');
            if (tab === 'mypage') navigate('mypage');
        }

        function renderOnboarding() {
            return `
                <div class="h-full bg-[radial-gradient(circle_at_top_left,_rgba(255,255,255,0.9),_rgba(255,255,255,0.45)_18%,_transparent_40%)] px-6 pt-8 pb-6 bg-slate-50">
                    <div class="h-full flex flex-col justify-between">
                        <div class="pt-10">
                            <div class="w-[76px] h-[76px] mx-auto rounded-[28px] bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center text-4xl shadow-soft text-white">🚗</div>
                            <div class="mt-8 text-center">
                                <span class="pill bg-amber-500/90 text-slate-900 text-[10px] tracking-[0.18em] uppercase">주차 서비스</span>
                                <h1 class="screen-title text-[30px] leading-[1.1] mt-5">낯선 곳에서도<br>주차를 쉽게</h1>

        }

        function startPaymentProcess() {
            navigate('payment_loading');
            setTimeout(() => navigate('payment_complete'), 2000);
        }

        function renderPaymentLoading() {
            return `
                <div class="h-full bg-white flex flex-col items-center justify-center text-center px-6">
                    <div class="w-16 h-16 border-[5px] border-brand-100 border-t-brand-500 rounded-full animate-spin mb-6"></div>
                    <h2 class="screen-title text-[22px]">결제 진행 중입니다</h2>
                    <p class="text-[11px] text-slate-500 mt-2 leading-5">잠시만 기다려주세요. 안전하게 결제 처리 중입니다.</p>
                </div>
            `;
        }

        function renderPaymentComplete() {
            return `
                <div class="h-full bg-white px-6 py-7 flex flex-col justify-between text-center">
                    <div class="pt-6">
                        <div class="w-20 h-20 rounded-full bg-emerald-100 text-emerald-600 mx-auto flex items-center justify-center text-3xl shadow-inner mb-6"><i class="fa-solid fa-check"></i></div>
                        <span class="pill bg-emerald-100 text-emerald-700 text-[10px]">결제 완료</span>
                        <h2 class="screen-title text-[28px] mt-4">결제가 완료되었습니다!</h2>

                        <div class="mt-8 rounded-[28px] bg-brand-50 border border-brand-200 p-6">
                            <p class="text-[11px] text-brand-700 font-bold">출차 유예 시간</p>
                            <p class="text-[34px] font-black text-brand-600 mt-1">15분 남음</p>
                            <p class="text-[11px] text-slate-500 mt-3 leading-5">정산기 앞 대기 없이, 유예 시간 내에 차량번호 인식으로 바로 출차하세요!</p>
                        </div>
                    </div>

                    <button onclick="simulateExit()" class="btn-primary w-full py-4 text-[14px]">출차하러 가기 (차량번호 출차 인식)</button>
                </div>
            `;
        }

        function simulateExit() {
            appState.isParkingActive = false;
            navigate('exit_complete');
        }

        function renderExitComplete() {
            return `
                <div class="h-full bg-white px-6 py-7 flex flex-col justify-between text-center">
                    <div class="pt-10">
                        <div class="w-20 h-20 rounded-full bg-brand-100 text-brand-600 mx-auto flex items-center justify-center text-3xl shadow-inner mb-6"><i class="fa-solid fa-car-on"></i></div>
                        <span class="pill bg-brand-50 text-brand-600 text-[10px]">출차 완료</span>
                        <h2 class="screen-title text-[28px] mt-4">안전하게 출차되었습니다</h2>
                        <p class="text-[11px] text-slate-500 mt-2 leading-5">이용해 주셔서 감사합니다. 다음에 또 편리하게 이용하세요!</p>
                    </div>

                    <button onclick="navigate('home')" class="btn-primary w-full py-4 text-[14px]">홈으로 돌아가기</button>
                </div>
            `;
        }

        function renderMypage() {
            return `
                <div class="h-full bg-slate-50 px-5 py-5">
                    <h2 class="screen-title text-[22px] mb-5">마이페이지</h2>

                    <div class="soft-card rounded-[24px] p-4 flex items-center gap-4 mb-5">
                        <div class="w-12 h-12 rounded-full bg-brand-500 text-white flex items-center justify-center text-lg shadow-soft">🚗</div>
                        <div>
                            <h3 class="text-[14px] font-extrabold text-slate-800">방문객 운전자님</h3>
                            <p class="text-[10px] text-slate-400">간편 로그인 회원 (목업)</p>
                        </div>
                    </div>

                    <div class="soft-card rounded-[24px] overflow-hidden">
                        <div onclick="navigate('vehicle_manage')" class="p-4 flex items-center justify-between border-b border-slate-100 cursor-pointer hover:bg-slate-50">
                            <div class="flex items-center gap-3">
                                <i class="fa-solid fa-car text-brand-500"></i>
                                <span class="text-[12px] font-extrabold text-slate-800">차량 관리</span>
                            </div>
                            <span class="text-[11px] text-slate-400">${appState.carNumber} &gt;</span>
                        </div>

                        <div class="p-4 flex items-center justify-between border-b border-slate-100 cursor-pointer hover:bg-slate-50">
                            <div class="flex items-center gap-3">
                                <i class="fa-solid fa-credit-card text-brand-500"></i>
                                <span class="text-[12px] font-extrabold text-slate-800">결제수단 관리</span>
                            </div>
                            <span class="text-[11px] text-slate-400">KB국민카드 &gt;</span>
                        </div>

                        <div class="p-4 flex items-center justify-between cursor-pointer hover:bg-slate-50">
                            <div class="flex items-center gap-3">
                                <i class="fa-solid fa-receipt text-brand-500"></i>
                                <span class="text-[12px] font-extrabold text-slate-800">이용 내역</span>
                            </div>
                            <span class="text-[11px] text-slate-400">&gt;</span>
                        </div>
                    </div>

                    <div class="mt-8 text-center">
                        <button onclick="navigate('onboarding')" class="text-[11px] text-slate-400 underline">로그아웃 / 온보딩으로 이동</button>
                    </div>
                </div>
            `;
        }

        function renderVehicleManage() {
            return `
                <div class="h-full bg-white px-5 py-5">
                    <div class="flex items-center mb-6">
                        <button onclick="navigate('mypage')" class="w-9 h-9 rounded-full bg-slate-100 text-slate-700 flex items-center justify-center mr-3"><i class="fa-solid fa-arrow-left"></i></button>
                        <h2 class="screen-title text-[20px]">차량 관리</h2>
                    </div>

                    <div class="rounded-[24px] bg-brand-50 border border-brand-200 p-4 mb-5">
                        <p class="text-[11px] font-extrabold text-brand-800">등록된 차량 번호</p>
                        <p class="text-[28px] font-black text-brand-600 mt-1">${appState.carNumber}</p>
                    </div>

                    <label class="block text-[11px] font-extrabold text-slate-700 mb-2">차량 번호 변경</label>
                    <input id="edit-car-num" value="${appState.carNumber}" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-[14px] font-bold text-slate-800 focus:outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-100 mb-8">

                    <button onclick="updateCarNum()" class="btn-primary w-full py-4 text-[14px]">저장하기</button>
                </div>
            `;
        }

        function updateCarNum() {
            const val = document.getElementById('edit-car-num').value;
            if (val) appState.carNumber = val;
            navigate('mypage');
        }

        render();
    </script>
</body>
</html>
